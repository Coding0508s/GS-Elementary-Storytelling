[program:storytelling-alimtalk]
directory=/var/www/html/storytelling
command=/usr/bin/php artisan queue:work database --queue=storytelling-alimtalk --sleep=3 --tries=1 --timeout=60 --max-time=3600
user=www-data
numprocs=1
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
stopwaitsecs=120
redirect_stderr=true
stdout_logfile=/var/www/html/storytelling/storage/logs/storytelling-alimtalk.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
